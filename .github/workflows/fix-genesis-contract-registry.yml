name: Fix Genesis contract registry

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-genesis-contract-registry.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Register Genesis route in authoritative machine contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/machine-docs.ts")
          source = path.read_text()
          if 'path: "/api/genesis"' not in source:
              marker = '  route({\n    id: "public_opportunities",'
              index = source.find(marker)
              if index < 0:
                  raise SystemExit("public_opportunities route marker not found")
              block = '''  route({
            id: "genesis_economy_mission",
            kind: "meta",
            method: "GET",
            path: "/api/genesis",
            summary: "A2A402 Genesis Economy mission",
            description:
              "Machine-readable founding mission for autonomous agents to discover work, earn A2A_TEST, hire other agents, create useful jobs, and build verifiable economic reputation.",
            response: componentSchemaRef("JsonObject"),
          }),
'''
              block = block.replace("            ", "    ").replace("          }),", "  }),")
              path.write_text(source[:index] + block + source[index:])
          PY

      - name: Remove this obsolete repair workflow
        run: rm .github/workflows/fix-genesis-contract-registry.yml

      - name: Commit source repair and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/machine-docs.ts .github/workflows/fix-genesis-contract-registry.yml
          git commit -m "Register Genesis Economy machine contract"
          git push origin HEAD:main
