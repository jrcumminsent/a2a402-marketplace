name: Apply runtime read lock fix
on:
  push:
    branches: [fix/recruiter-registry-discovery]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recruiter-registry-discovery
      - name: Apply minimal patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/database/src/runtime-transaction-coordinator.ts')
          s = p.read_text()
          old = '''        return reader(current);\n      },\n      { lockKeys: [this.runtimeLockKey()] },\n    );'''
          new = '''        return reader(current);\n      },\n    );'''
          if old not in s:
              raise SystemExit('expected read lock block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/apply-runtime-read-lock-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/database/src/runtime-transaction-coordinator.ts
          git commit -m "Stop read-only traffic contending on runtime writer lock"
          git push origin HEAD:fix/recruiter-registry-discovery
