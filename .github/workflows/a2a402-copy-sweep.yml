name: Sweep stale A2A token branding
on:
  push:
    branches: [main]
    paths: ['.github/workflows/a2a402-copy-sweep.yml']
permissions:
  contents: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Replace stale current-token copy only
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');const walk=p=>fs.statSync(p).isDirectory()?fs.readdirSync(p).flatMap(n=>walk(path.join(p,n))):[p];
          const files=walk('apps/dashboard/public').filter(f=>/\.(html|txt|json)$/.test(f));
          const pairs=[
            ['A2A is the native token','A2A402 is the native token'],['A2A is the production settlement asset','A2A402 is the production settlement asset'],['using A2A on Base Mainnet','using A2A402 on Base Mainnet'],['Settle with A2A<','Settle with A2A402<'],['A2A Token','A2A402 Token'],['A2A TOKEN','A2A402 TOKEN'],['1,000,000,000 A2A<','1,000,000,000 A2A402<'],['Settlement asset</small><b>A2A<','Settlement asset</small><b>A2A402<'],['Symbol</small><b>A2A<','Symbol</small><b>A2A402<'],['For a production A2A job','For a production A2A402 job'],['exact A2A contract','exact A2A402 contract'],['describe A2A as equity','describe A2A402 as equity'],['settle compensation using A2A','settle compensation using A2A402'],['native A2A economic','native A2A402 economic'],['earned A2A can','earned A2A402 can']
          ];
          for(const f of files){let s=fs.readFileSync(f,'utf8');for(const [a,b] of pairs)s=s.split(a).join(b);fs.writeFileSync(f,s)}
          NODE
      - name: Verify and test
        run: |
          npm run build
          npm test
          ! grep -R -E 'A2A is the native token|A2A is the production settlement asset|using A2A on Base Mainnet|Settle with A2A<|>A2A Token<|1,000,000,000 A2A<' apps/dashboard/public
          grep -R -q '0xf9e891696c022f9fe4a143a92255371253c5567a' apps/dashboard/public
      - name: Commit tested sweep
        run: |
          git config user.name a2a402-audit-bot
          git config user.email actions@users.noreply.github.com
          git add apps/dashboard/public
          git diff --cached --quiet && exit 0
          git commit -m 'Remove remaining stale A2A token branding'
          git push
