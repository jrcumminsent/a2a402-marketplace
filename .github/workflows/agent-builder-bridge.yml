name: Agent Builder Bridge

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  issues: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Convert approved agent proposals into GitHub issues
        uses: actions/github-script@v7
        with:
          script: |
            const endpoint = "https://a2a402.market/api/builders/proposals?status=approved";
            const response = await fetch(endpoint, {
              headers: { "user-agent": "A2A402-Builder-Bridge/0.1" },
            });
            if (!response.ok) {
              throw new Error(`Builder API returned ${response.status}`);
            }
            const payload = await response.json();
            const proposals = Array.isArray(payload?.data) ? payload.data : [];

            for (const proposal of proposals) {
              const marker = `<!-- a2a402-builder-proposal:${proposal.proposal_id} -->`;
              const existing = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "all",
                per_page: 100,
              });
              if (existing.some((issue) => String(issue.body || "").includes(marker))) {
                core.info(`Proposal ${proposal.proposal_id} already bridged.`);
                continue;
              }

              const criteria = (proposal.acceptance_criteria || [])
                .map((item) => `- [ ] ${item}`)
                .join("\n") || "- [ ] Implementation satisfies the approved proposal.";
              const surfaces = (proposal.affected_surfaces || []).join(", ") || "unspecified";
              const reviewers = (proposal.approvals || []).map((id) => `\`${id}\``).join(", ") || "none";
              const body = [
                marker,
                "## Agent Builder proposal",
                "",
                `**Proposal ID:** \`${proposal.proposal_id}\``,
                `**Proposed by agent:** \`${proposal.author_agent_id}\``,
                `**Approved by agents:** ${reviewers}`,
                `**Affected surfaces:** ${surfaces}`,
                "",
                "### Summary",
                proposal.summary || "No summary supplied.",
                "",
                "### Rationale",
                proposal.rationale || "No rationale supplied.",
                "",
                "### Acceptance criteria",
                criteria,
                "",
                "### Risk / compatibility notes",
                proposal.risk || "Unspecified.",
                "",
                "### Implementation boundary",
                "This issue originated from the autonomous A2A402 Builder Loop. Implementation must occur through a branch + pull request and pass normal repository CI/review. Approval of the agent proposal does not authorize direct production access or merge.",
                "",
                "### Contribution credit",
                "Preserve the proposal ID in the implementation PR so proposal authors, reviewers, builders, and verification evidence can be associated with the deployed change.",
              ].join("\n");

              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[Agent Builder] ${proposal.title}`.slice(0, 240),
                body,
              });
              core.info(`Created issue #${issue.data.number} for ${proposal.proposal_id}.`);
            }
