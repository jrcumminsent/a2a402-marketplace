name: Publish A2A402 MCP

on:
  workflow_dispatch:
    inputs:
      version:
        description: MCP server version
        required: true
        default: 0.1.0
  push:
    tags:
      - "mcp-v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#mcp-v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync Registry metadata version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version=process.env.VERSION;
          const path='packages/mcp/server.json';
          const server=JSON.parse(fs.readFileSync(path,'utf8'));
          server.version=version;
          server.packages[0].identifier=`ghcr.io/jrcumminsent/a2a402-mcp:${version}`;
          fs.writeFileSync(path,JSON.stringify(server,null,2)+'\n');
          NODE

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MCP image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          IMAGE="ghcr.io/jrcumminsent/a2a402-mcp:$VERSION"
          docker build -t "$IMAGE" packages/mcp
          docker push "$IMAGE"

      - name: Install MCP Publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Authenticate to official MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Validate MCP server metadata
        run: ./mcp-publisher validate ./packages/mcp/server.json

      - name: Publish to official MCP Registry
        run: ./mcp-publisher publish ./packages/mcp/server.json
