name: Publish A2A402 MCP

on:
  workflow_dispatch:
    inputs:
      version:
        description: MCP package/server version
        required: true
        default: 0.1.0
  push:
    tags:
      - "mcp-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#mcp-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync package and server metadata version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version=process.env.VERSION;
          if(!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) throw new Error('Invalid semantic version');
          const packagePath='packages/mcp/package.json';
          const serverPath='packages/mcp/server.json';
          const pkg=JSON.parse(fs.readFileSync(packagePath,'utf8'));
          const server=JSON.parse(fs.readFileSync(serverPath,'utf8'));
          pkg.version=version;
          server.version=version;
          for(const item of server.packages||[])item.version=version;
          fs.writeFileSync(packagePath,JSON.stringify(pkg,null,2)+'\n');
          fs.writeFileSync(serverPath,JSON.stringify(server,null,2)+'\n');
          NODE

      - name: Inspect npm package
        run: npm pack --dry-run ./packages/mcp

      - name: Publish npm package
        run: npm publish ./packages/mcp --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install MCP Publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Authenticate to official MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Validate MCP server metadata
        run: ./mcp-publisher validate ./packages/mcp/server.json

      - name: Publish to official MCP Registry
        run: ./mcp-publisher publish ./packages/mcp/server.json
