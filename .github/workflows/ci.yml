name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    name: Typecheck, test, demo, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply Genesis registry repair
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: python
        run: |
          from pathlib import Path
          p = Path("apps/api/src/machine-docs.ts")
          s = p.read_text()
          if 'path: "/api/genesis"' not in s:
              marker = '''  route({
            id: "public_opportunities",'''
              idx = s.find(marker)
              if idx < 0:
                  raise SystemExit("public_opportunities route marker not found")
              block = '''  route({
            id: "genesis_economy_mission",
            kind: "meta",
            method: "GET",
            path: "/api/genesis",
            summary: "A2A402 Genesis Economy mission",
            description:
              "Machine-readable founding mission for autonomous agents to discover work, earn A2A_TEST, hire other agents, create useful jobs, and build verifiable economic reputation.",
            response: componentSchemaRef("JsonObject"),
          }),
'''
              p.write_text(s[:idx] + block + s[idx:])

      - name: Persist Genesis registry repair
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet -- apps/api/src/machine-docs.ts; then
            echo "Genesis registry already repaired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/machine-docs.ts
          git commit -m "Register Genesis Economy machine contract"
          git push origin HEAD:main

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Run economy demonstration
        run: pnpm demo:economy

      - name: Build runtime artifacts
        run: pnpm build

      - name: Verify runtime artifacts
        shell: bash
        run: |
          test -s dist/apps/api/server.js
          test -s dist/apps/api/worker.js
          test -s dist/packages/database/src/migrate.js
          test -s dist/packages/database/migrations/meta/_journal.json

  migration:
    name: PostgreSQL migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: a2a402_ci
          POSTGRES_USER: a2a402_ci
          POSTGRES_PASSWORD: a2a402_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U a2a402_ci -d a2a402_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://a2a402_ci:a2a402_ci_password@127.0.0.1:5432/a2a402_ci
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Reapply migrations
        run: pnpm db:migrate

  container-smoke:
    name: Container smoke test
    needs: [quality, migration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build and start API dependency graph
        run: docker compose up --detach --build api

      - name: Wait for API health
        shell: bash
        run: |
          container_id="$(docker compose ps --quiet api)"
          test -n "${container_id}"
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "${container_id}")"
            if [[ "${status}" == "healthy" ]]; then
              exit 0
            fi
            if [[ "${status}" == "unhealthy" ]]; then
              docker compose logs --no-color api migrate postgres redis
              exit 1
            fi
            sleep 2
          done
          docker compose logs --no-color api migrate postgres redis
          exit 1

      - name: Verify machine-readable routes
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --dump-header root-headers.txt \
            --output root.json \
            http://127.0.0.1:3000/
          grep --ignore-case --extended-regexp \
            '^content-type: application/json([;[:space:]]|$)' \
            root-headers.txt
          jq --exit-status 'type == "object"' root.json
          curl --fail --silent --show-error http://127.0.0.1:3000/health |
            jq --exit-status 'type == "object"'

      - name: Show service state
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color api migrate postgres redis

      - name: Remove disposable CI volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
