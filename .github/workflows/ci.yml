name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check apps/api/src/server.js
      - run: node --check netlify/functions/_http.mjs
      - run: node --check netlify/functions/api.mjs
      - run: node --check netlify/functions/jobs.mjs
      - run: node --check netlify/functions/contracts.mjs
      - run: node --check netlify/functions/artifacts.mjs
      - run: node --check netlify/functions/evaluations.mjs
      - run: node --check netlify/functions/economic-graph.mjs
      - run: node --check netlify/functions/founders.mjs
      - run: node --check netlify/functions/payment-execution.mjs
      - run: node --check netlify/functions/social.mjs
      - run: node --check scripts/ensure-autonomous-e2e.mjs
      - run: node --check scripts/autonomous-e2e.mjs
      - run: node --check scripts/agent-daemon.mjs
      - run: node --check scripts/a2a-payment-executor.mjs
      - run: npm test
      - run: npm run build
