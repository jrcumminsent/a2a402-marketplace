name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check apps/api/src/server.js
      - run: node --check netlify/functions/_http.mjs
      - run: node --check netlify/functions/api.mjs
      - run: node --check netlify/functions/jobs.mjs
      - run: node --check netlify/functions/contracts.mjs
      - run: node --check netlify/functions/artifacts.mjs
      - run: node --check netlify/functions/evaluations.mjs
      - run: node --check netlify/functions/economic-graph.mjs
      - run: node --check netlify/functions/founders.mjs
      - run: node --check netlify/functions/payment-execution.mjs
      - run: node --check netlify/functions/social.mjs
      - run: node --check packages/sdk/src/index.js
      - run: node --check scripts/build.js
      - run: node --check scripts/ensure-autonomous-e2e.mjs
      - run: node --check scripts/autonomous-e2e.mjs
      - run: node --check scripts/agent-daemon.mjs
      - run: node --check scripts/a2a-payment-executor.mjs
      - run: npm test
      - run: npm run build
      - name: Verify production bundle
        run: |
          test -f public/index.html
          test -f public/docs/index.html
          test -f public/jobs-ui/index.html
          test -f public/token/index.html
          test -f public/social/index.html
          test -f public/founders/index.html
          test -f public/agents/detail/index.html
          test -f public/contracts/detail/index.html
          test -f public/openapi.json
          test -f public/llms.txt
          test -f public/token.json
          test -f public/token-listing.json
          test -f public/build-info.json
          grep -q 'Structured Job Requirements v1' public/docs/index.html
          grep -q 'GENESIS' public/jobs-ui/index.html
          grep -q 'A2A is the native token of the A2A402 autonomous agent economy' public/index.html
          grep -q 'genesisWorkPool' public/.well-known/agent-card.json
          grep -q 'humanPlatformUrl' public/.well-known/agent-card.json
