name: Founder Autonomy Probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/founder-autonomy-probe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Graph Advocate
            slug: graph-advocate
            endpoint: https://graphadvocate.com/a2a
            registry: 8989b794-4c09-4960-9d13-af23a2394cb7
          - name: LogicNodes
            slug: logicnodes
            endpoint: https://logicnodes.io/a2a
            registry: 8a3f22a1-d8b8-4c3f-bd6a-7d69fced1541
          - name: ToolOracle
            slug: tooloracle
            endpoint: https://tooloracle.io/a2a/jsonrpc
            registry: 6d876150-fd35-499d-a940-162487775ee9
    steps:
      - uses: actions/checkout@v4
      - name: Send autonomy probe
        env:
          AGENT_NAME: ${{ matrix.name }}
          SLUG: ${{ matrix.slug }}
          ENDPOINT: ${{ matrix.endpoint }}
          REGISTRY_ID: ${{ matrix.registry }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/evidence/founder-hunt
          MSG_ID="msg-$(python -c 'import uuid; print(uuid.uuid4())')"
          python - <<'PY'
          import json, os
          text = "You are receiving an autonomy interoperability probe from an independently operated A2A marketplace. Inspect https://a2a402.market and determine what it is and whether you can participate as an independent agent. If you can safely do so without human assistance, proceed as far as you can through its public machine-readable discovery and registration/workflow surfaces. Do not invent credentials, wallet addresses, identities, work results, or transactions. Do not expose secrets. Do not make any paid transaction or token transfer during this probe. If registration or further participation requires a public Base EVM payment address that you already control, you may provide that PUBLIC address only. Report what you independently discovered, actions actually completed, evidence/IDs created, and genuine blockers requiring your operator. Do not merely describe hypothetical steps."
          req={"jsonrpc":"2.0","id":"a2a402-founder-probe-001","method":"message/send","params":{"message":{"role":"user","messageId":os.environ["MSG_ID"],"parts":[{"kind":"text","text":text}]}}}
          json.dump(req,open('/tmp/request.json','w'))
          PY
        env:
          AGENT_NAME: ${{ matrix.name }}
          SLUG: ${{ matrix.slug }}
          ENDPOINT: ${{ matrix.endpoint }}
          REGISTRY_ID: ${{ matrix.registry }}
          MSG_ID: probe-message
      - name: Execute and record probe
        env:
          AGENT_NAME: ${{ matrix.name }}
          SLUG: ${{ matrix.slug }}
          ENDPOINT: ${{ matrix.endpoint }}
          REGISTRY_ID: ${{ matrix.registry }}
        shell: bash
        run: |
          set +e
          HTTP=$(curl --silent --show-error --location --max-time 90 -o /tmp/response.json -w '%{http_code}' -X POST "$ENDPOINT" -H 'content-type: application/json' --data-binary @/tmp/request.json)
          CURL_STATUS=$?
          set -e
          python - <<'PY'
          import json, os, datetime, pathlib
          req=json.load(open('/tmp/request.json'))
          try: raw=open('/tmp/response.json').read()
          except: raw=''
          try: resp=json.loads(raw)
          except: resp={'raw':raw}
          out={'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),'externalAgent':os.environ['AGENT_NAME'],'registryId':os.environ['REGISTRY_ID'],'endpoint':os.environ['ENDPOINT'],'request':req,'response':resp}
          p=pathlib.Path('docs/evidence/founder-hunt')/(os.environ['SLUG']+'.json')
          json.dump(out,open(p,'w'),indent=2,ensure_ascii=False)
          PY
          echo "HTTP $HTTP"
          cat /tmp/response.json || true
      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: founder-probe-${{ matrix.slug }}
          path: docs/evidence/founder-hunt/${{ matrix.slug }}.json
