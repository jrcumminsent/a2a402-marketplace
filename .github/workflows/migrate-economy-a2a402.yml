name: Migrate core economy to A2A402

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-economy-a2a402.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace legacy A2A token logic
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'apps/api/src/economy.js';
          let s = fs.readFileSync(p, 'utf8');
          const replacements = [
            ["assets:['A2A']", "assets:['A2A402']"],
            ["A2A_MAINNET_NETWORK,'A2A'", "A2A_MAINNET_NETWORK,'A2A402'"],
            ["asset:'A2A'", "asset:'A2A402'"],
            ["route.asset==='A2A'", "route.asset==='A2A402'"],
            ["p.asset==='A2A'", "p.asset==='A2A402'"],
            ["asset:'A2A',primary", "asset:'A2A402',primary"],
            ["p.asset==='A2A'))", "p.asset==='A2A402'))"],
            ["preferredSettlementAsset:'A2A'", "preferredSettlementAsset:'A2A402'"],
            ["preferredAsset='A2A'", "preferredAsset='A2A402'"],
            ["paymentAsset==='A2A'", "paymentAsset==='A2A402'"],
            ["paymentAsset='A2A'", "paymentAsset='A2A402'"],
            ["job.paymentAsset==='A2A'", "job.paymentAsset==='A2A402'"],
            ["job.paymentAsset==='A2A402402'", "job.paymentAsset==='A2A402'"],
            ["asset:'A2A',network:A2A_MAINNET_NETWORK", "asset:'A2A402',network:A2A_MAINNET_NETWORK"],
            ["t.asset==='A2A'", "t.asset==='A2A402'"],
            ["adapter:'base-mainnet-a2a-erc20'", "adapter:'base-mainnet-a2a402-erc20'"],
            ["'A2A production settlement uses Base mainnet'", "'A2A402 production settlement uses Base mainnet'"],
            ["'creator needs a Base Mainnet-compatible wallet for A2A jobs'", "'creator needs a Base Mainnet-compatible wallet for A2A402 jobs'"],
            ["`A2A payment wallet required before claim; register a Base wallet via PATCH /agents/${agentId}`", "`A2A402 payment wallet required before claim; register a Base wallet via PATCH /agents/${agentId}`"],
            ["'worker needs a Base Mainnet-compatible wallet for A2A jobs'", "'worker needs a Base Mainnet-compatible wallet for A2A402 jobs'"],
            ["'job is not an A2A token job'", "'job is not an A2A402 token job'"],
            ["'job is not a Base mainnet A2A job'", "'job is not a Base mainnet A2A402 job'"],
            ["'Register a public EVM/Base wallet address that can receive A2A.'", "'Register a public EVM/Base wallet address that can receive A2A402.'"],
            ["'Declare chain as eip155:8453 (or base) and include A2A in assets.'", "'Declare chain as eip155:8453 (or base) and include A2A402 in assets.'"],
            ["'Agent can claim A2A-denominated jobs.'", "'Agent can claim A2A402-denominated jobs.'"],
            ["'PATCH the authenticated agent profile with a Base wallet before claiming A2A jobs.'", "'PATCH the authenticated agent profile with a Base wallet before claiming A2A402 jobs.'"],
            ["event('JOB_AWAITING_PAYMENT',{jobId,asset:'A2A'", "event('JOB_AWAITING_PAYMENT',{jobId,asset:'A2A402'"],
            ["event('JOB_PAID',{jobId,transactionId:tx.id,txHash:chainPayment.worker.txHash,feeTxHash:chainPayment.fee.txHash,asset:'A2A'", "event('JOB_PAID',{jobId,transactionId:tx.id,txHash:chainPayment.worker.txHash,feeTxHash:chainPayment.fee.txHash,asset:'A2A402'"],
            ["asset:'A2A',network:'eip155:8453'", "asset:'A2A402',network:'eip155:8453'"]
          ];
          for (const [a,b] of replacements) s = s.split(a).join(b);
          s = s.replace(/\bA2A-denominated\b/g, 'A2A402-denominated');
          s = s.replace(/\bA2A jobs\b/g, 'A2A402 jobs');
          s = s.replace(/\bA2A token job\b/g, 'A2A402 token job');
          fs.writeFileSync(p, s);
          if (/['\"]A2A['\"]/.test(s)) {
            console.error('Legacy quoted A2A token literal remains in economy.js');
            const hits = s.match(/.{0,80}['\"]A2A['\"].{0,80}/g) || [];
            console.error(hits.join('\n---\n'));
            process.exit(1);
          }
          NODE
      - name: Commit migration
        run: |
          git config user.name "a2a402-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/src/economy.js
          git diff --cached --quiet && exit 0
          git commit -m "Migrate core economy logic to A2A402"
          git push
