name: Migrate core economy to A2A402

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace legacy token references
        run: |
          node <<'NODE'
          const fs = require('fs');
          const OLD='0xF2bb6DC14E9097EC08F9Eaa9C6B7d39662195F01';
          const NEW='0xf9e891696c022f9fe4a143a92255371253c5567a';
          function rw(path, pairs, regexes=[]) {
            let s=fs.readFileSync(path,'utf8');
            s=s.split(OLD).join(NEW);
            for(const [a,b] of pairs) s=s.split(a).join(b);
            for(const [r,b] of regexes) s=s.replace(r,b);
            fs.writeFileSync(path,s);
          }

          rw('apps/api/src/economy.js', [
            ["assets:['A2A']", "assets:['A2A402']"],
            ["A2A_MAINNET_NETWORK,'A2A'", "A2A_MAINNET_NETWORK,'A2A402'"],
            ["asset:'A2A'", "asset:'A2A402'"],
            ["route.asset==='A2A'", "route.asset==='A2A402'"],
            ["p.asset==='A2A'", "p.asset==='A2A402'"],
            ["preferredSettlementAsset:'A2A'", "preferredSettlementAsset:'A2A402'"],
            ["preferredAsset='A2A'", "preferredAsset='A2A402'"],
            ["paymentAsset==='A2A'", "paymentAsset==='A2A402'"],
            ["job.paymentAsset==='A2A'", "job.paymentAsset==='A2A402'"],
            ["t.asset==='A2A'", "t.asset==='A2A402'"],
            ["adapter:'base-mainnet-a2a-erc20'", "adapter:'base-mainnet-a2a402-erc20'"],
            ["'A2A production settlement uses Base mainnet'", "'A2A402 production settlement uses Base mainnet'"],
            ["'creator needs a Base Mainnet-compatible wallet for A2A jobs'", "'creator needs a Base Mainnet-compatible wallet for A2A402 jobs'"],
            ["`A2A payment wallet required before claim; register a Base wallet via PATCH /agents/${agentId}`", "`A2A402 payment wallet required before claim; register a Base wallet via PATCH /agents/${agentId}`"],
            ["'worker needs a Base Mainnet-compatible wallet for A2A jobs'", "'worker needs a Base Mainnet-compatible wallet for A2A402 jobs'"],
            ["'job is not an A2A token job'", "'job is not an A2A402 token job'"],
            ["'job is not a Base mainnet A2A job'", "'job is not a Base mainnet A2A402 job'"],
            ["'Register a public EVM/Base wallet address that can receive A2A.'", "'Register a public EVM/Base wallet address that can receive A2A402.'"],
            ["'Declare chain as eip155:8453 (or base) and include A2A in assets.'", "'Declare chain as eip155:8453 (or base) and include A2A402 in assets.'"],
            ["'Agent can claim A2A-denominated jobs.'", "'Agent can claim A2A402-denominated jobs.'"],
            ["'PATCH the authenticated agent profile with a Base wallet before claiming A2A jobs.'", "'PATCH the authenticated agent profile with a Base wallet before claiming A2A402 jobs.'"],
            ["'A2A'", "'A2A402'"]
          ]);

          rw('apps/dashboard/public/index.html', [
            ['A2A is the native token of the A2A402 autonomous agent economy.','A2A402 is the native token of the A2A402 autonomous agent economy.'],
            ['Agents use A2A as the platform\'s native economic and settlement asset','Agents use A2A402 as the platform\'s native economic and settlement asset'],
            ['A2A-denominated jobs','A2A402-denominated jobs'],
            ['>A2A TOKEN<','>A2A402 TOKEN<'],
            ['Explore A2A Token','Explore A2A402 Token'],
            ['A2A settlement verification enabled','A2A402 settlement verification enabled'],
            ['A2A is the native economic layer used inside the loop','A2A402 is the native economic layer used inside the loop'],
            ['Verified A2A payment on Base.','Verified A2A402 payment on Base.'],
            ['native A2A economic layer','native A2A402 economic layer'],
            ['<b>A2A Token</b>','<b>A2A402 Token</b>']
          ]);

          rw('apps/dashboard/public/token/index.html', [
            ['<title>A2A — Native Token of A2A402</title>','<title>A2A402 — Native Token of A2A402</title>'],
            ['A2A is the native token of the A2A402 autonomous agent economy on Base Mainnet.','A2A402 is the native token of the A2A402 autonomous agent economy on Base Mainnet.'],
            ['A2A<b>402</b> / A2A TOKEN','A2A<b>402</b> / A2A402 TOKEN'],
            ['<h1>A2A</h1>','<h1>A2A402</h1>'],
            ['A2A is the economic asset used inside that platform','A2A402 is the economic asset used inside that platform'],
            ['A2A = the platform\'s native economic and settlement token.','A2A402 = the platform\'s native economic and settlement token.'],
            ['A2A-denominated jobs use A2A','A2A402-denominated jobs use A2A402'],
            ['Agents can earn A2A','Agents can earn A2A402'],
            ['standard A2A jobs','standard A2A402 jobs'],
            ['grants can use A2A','grants can use A2A402'],
            ['A2A is transferred','A2A402 is transferred'],
            ['Earned A2A can fund','Earned A2A402 can fund'],
            ['Canonical positioning</div><div>A2A is the native token','Canonical positioning</div><div>A2A402 is the native token'],
            ['Name</div><div>A2A</div>','Name</div><div>A2A402</div>'],
            ['Symbol</div><div>A2A</div>','Symbol</div><div>A2A402</div>'],
            ['1,000,000,000 A2A','1,000,000,000 A2A402'],
            ['A2A settlement verification','A2A402 settlement verification'],
            ['A2A utility should be explained','A2A402 utility should be explained'],
            ['A2A is its native economic token','A2A402 is its native economic token']
          ]);

          rw('apps/dashboard/public/llms.txt', [
            ['A2A is the native token of the A2A402 autonomous agent economy on Base Mainnet.','A2A402 is the native token of the A2A402 autonomous agent economy on Base Mainnet.'],
            ['required before A2A settlement','required before A2A402 settlement'],
            ['"assets":["A2A"]','"assets":["A2A402"]'],
            ['paymentAsset=A2A','paymentAsset=A2A402'],
            ['public Base A2A wallet','public Base A2A402 wallet'],
            ['Accepted A2A work','Accepted A2A402 work'],
            ['A2A settlement is non-custodial','A2A402 settlement is non-custodial'],
            ['Base Mainnet ERC-20 transfers','Base Mainnet A2A402 ERC-20 transfers']
          ]);

          rw('apps/dashboard/public/openapi.json', [
            ['settle A2A on Base Mainnet','settle A2A402 on Base Mainnet'],
            ['A2A configuration','A2A402 configuration'],
            ['Base Mainnet A2A transaction hashes','Base Mainnet A2A402 transaction hashes']
          ]);

          const critical=[
            'apps/api/src/economy.js',
            'apps/dashboard/public/index.html',
            'apps/dashboard/public/token/index.html',
            'apps/dashboard/public/llms.txt',
            'apps/dashboard/public/openapi.json'
          ];
          for(const p of critical){
            const s=fs.readFileSync(p,'utf8');
            if(s.includes(OLD)){ console.error(`Old contract remains in ${p}`); process.exit(1); }
          }
          const economy=fs.readFileSync('apps/api/src/economy.js','utf8');
          if(/['\"]A2A['\"]/.test(economy)){ console.error('Quoted legacy A2A asset remains in economy.js'); process.exit(1); }
          NODE
      - name: Commit migration
        run: |
          git config user.name "a2a402-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/src/economy.js apps/dashboard/public/index.html apps/dashboard/public/token/index.html apps/dashboard/public/llms.txt apps/dashboard/public/openapi.json
          git diff --cached --quiet && exit 0
          git commit -m "Finish A2A402 token migration across core and public surfaces"
          git push
