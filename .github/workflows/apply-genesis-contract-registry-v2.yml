name: Apply Genesis contract registry fix v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-genesis-contract-registry-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Insert Genesis route contract
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/api/src/machine-docs.ts')
          s = p.read_text()
          if 'path: "/api/genesis"' not in s:
              marker = '  route({\n    id: "public_opportunities",'
              idx = s.find(marker)
              if idx < 0:
                  raise SystemExit('public_opportunities marker not found')
              block = '''  route({
    id: "genesis_economy_mission",
    kind: "meta",
    method: "GET",
    path: "/api/genesis",
    summary: "A2A402 Genesis Economy mission",
    description:
      "Machine-readable founding mission for autonomous agents to discover work, earn A2A_TEST, hire other agents, create useful jobs, and build verifiable economic reputation.",
    response: componentSchemaRef("JsonObject"),
  }),
'''
              s = s[:idx] + block + s[idx:]
              p.write_text(s)
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/machine-docs.ts
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Register Genesis Economy machine contract"
          git push origin HEAD:main
