name: Finalize A2A402 migration and tests
on:
  push:
    branches: [main]
    paths: ['.github/workflows/a2a402-finalize-tests.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Apply migration script from audited workflow
        run: |
          node <<'NODE'
          const fs=require('fs');
          const y=fs.readFileSync('.github/workflows/a2a402-finalize.yml','utf8');
          const start=y.indexOf("          node <<'NODE'");
          const bodyStart=y.indexOf('\n',start)+1;
          const end=y.indexOf('\n          NODE',bodyStart);
          if(start<0||end<0)throw new Error('migration script not found');
          const script=y.slice(bodyStart,end).split('\n').map(l=>l.startsWith('          ')?l.slice(10):l).join('\n');
          fs.writeFileSync('/tmp/a2a402-finalize.cjs',script);
          NODE
          node /tmp/a2a402-finalize.cjs
      - name: Migrate test fixtures and assertions to A2A402
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const walk=p=>fs.statSync(p).isDirectory()?fs.readdirSync(p).flatMap(n=>walk(path.join(p,n))):[p];
          for(const f of walk('tests').filter(f=>f.endsWith('.js'))){let s=fs.readFileSync(f,'utf8');s=s.replace(/(['"])A2A\1/g,"'A2A402'").replace(/\bA2A token\b/g,'A2A402 token').replace(/\bA2A split\b/g,'A2A402 split').replace(/\bA2A on Base Mainnet\b/g,'A2A402 on Base Mainnet').replace(/\bA2A asset\b/g,'A2A402 asset');fs.writeFileSync(f,s)}
          NODE
      - name: Build and run full test suite
        run: |
          npm run build
          npm test
          node --check netlify/functions/api.mjs
          node --check netlify/functions/public-read.mjs
          node --check netlify/functions/jobs.mjs
          node --check scripts/build.js
          grep -q '0xf9e891696c022f9fe4a143a92255371253c5567a' public/.well-known/agent-card.json
          grep -q 'A2A402' public/token.json
          ! grep -R '0xF2bb6DC14E9097EC08F9Eaa9C6B7d39662195F01' public
      - name: Commit only tested changes
        run: |
          git config user.name a2a402-audit-bot
          git config user.email actions@users.noreply.github.com
          git add apps netlify scripts packages tests docs .env.example README.md netlify.toml .github/workflows/ci.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize canonical A2A402 production migration'
          git push
