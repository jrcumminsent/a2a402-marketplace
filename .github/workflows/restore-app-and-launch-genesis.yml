name: Restore API and launch Genesis Economy

on:
  push:
    paths:
      - '.github/workflows/restore-app-and-launch-genesis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-and-wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore app and wire Genesis mission
        shell: bash
        run: |
          set -euo pipefail
          git checkout 90f9425efc506b069287503f46674622409ada70 -- apps/api/src/app.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/app.ts')
          s = p.read_text()
          s = s.replace('  genesisBounty,\n  lightweightAgentDocument,', '  genesisBounty,\n  genesisEconomyMission,\n  lightweightAgentDocument,')
          needle = '  server.get("/api/discovery", async () =>\n    autonomousMarketplaceDiscovery(config.engine.publicMarketUrl),\n  );'
          replacement = needle + '\n  server.get("/api/genesis", async () =>\n    genesisEconomyMission(config.engine.publicMarketUrl),\n  );'
          if needle not in s:
              raise SystemExit('discovery route insertion point not found')
          s = s.replace(needle, replacement, 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/app.ts
          git commit -m "Wire Genesis Economy mission endpoint"
          git push
