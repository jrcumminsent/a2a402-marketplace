[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/marketplace"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/marketplace/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/public-read"
  status = 200

[[redirects]]
  from = "/economy/graph"
  to = "/.netlify/functions/economic-graph"
  status = 200

