[build]
  # Prepare durable onboarding, beginner TEST jobs, and resilient startup before compiling.
  # Resolve the sandbox contractor through the Registry SDK and send one bounded compatibility invitation.
  # Probe failure is non-fatal; remove this one-shot probe after a successful delivery.
  command = "node scripts/prepare-persistent-agent-funnel.mjs && node scripts/prepare-beginner-persistent-jobs.mjs && node scripts/prepare-seed-lock-resilience.mjs && python -m pip install --disable-pip-version-check 'a2a-registry-client[a2a]' && python scripts/sandbox-contractor-sdk-probe.py && pnpm db:migrate && pnpm build"
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/.netlify/functions/api/"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

